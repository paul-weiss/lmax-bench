  <text x="710.0" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#20242a">The LMAX Disruptor feeding a CLOB &#8212; BTC-USD</text>
  <text x="710.0" y="64" text-anchor="middle" font-size="14" fill="#5b6570">consumed events built the book; published events wait in the ring; the claimed event is the next order &#8212; as implemented four times in lmax-bench</text>
