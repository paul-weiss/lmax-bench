  </g>
  <text x="60" y="672" font-size="10.5" fill="#5b6570">Slots show the last three digits of the 64-bit sequence 8,231,419 &#8230; 8,231,427 &#8212; the ring has cycled ~125,600 times;</text>
  <text x="60" y="688" font-size="10.5" fill="#5b6570">seq 8,231,427 lands in slot 8,231,427 &amp; 65,535 = 39,427. Sixteen segments drawn for 65,536.</text>

