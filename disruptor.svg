      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8833a"/></marker>
  </defs>

  <!-- ===== left: producer + ring ===== -->
  <rect x="120" y="108" width="360" height="64" rx="10" fill="#f4f6f8" stroke="#c9d0d8"/>
  <text x="300" y="134" text-anchor="middle" font-size="14.5" font-weight="600" fill="#20242a">Producer thread &#8212; order gateway</text>
  <text x="300" y="154" text-anchor="middle" font-size="12" fill="#5b6570">claim slot &#8594; write order in place &#8594; publish</text>
  <line x1="300" y1="172" x2="300" y2="200" stroke="#20242a" stroke-width="2" marker-end="url(#arr)"/>

