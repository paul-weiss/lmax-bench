<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1420" height="700" fill="#ffffff"/>
  <text x="710.0" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#20242a">The LMAX Disruptor feeding a CLOB &#8212; BTC-USD</text>
  <text x="710.0" y="64" text-anchor="middle" font-size="14" fill="#5b6570">one thread publishes orders into the ring; one single-writer core matches them against the book &#8212; as implemented four times in lmax-bench</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20242a"/></marker>
